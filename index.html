<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Учёт доходов и расходов</title><link rel="stylesheet" href="style.css"></head><body><main class="container"><h1>Учёт доходов и расходов</h1><p>Данные хранятся в Google Таблице.</p><section class="card"><h2>Подключение</h2><label>URL Google Apps Script<input id="apiUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec"></label><label>Ключ<input id="apiKey" type="password"></label><button id="saveSettings">Сохранить подключение</button><span id="status"></span></section><section class="summary"><div class="card">Доход<strong id="income">0.00</strong></div><div class="card">Расход<strong id="expense">0.00</strong></div><div class="card">Остаток<strong id="balance">0.00</strong></div></section><section class="card"><h2 id="title">Добавить операцию</h2><form id="form"><input type="hidden" id="id"><div class="grid"><label>Дата дохода<input id="incomeDate" type="date"></label><label>Сумма дохода<input id="incomeAmount" type="number" step="0.01" min="0"></label><label>Дата расхода<input id="expenseDate" type="date"></label><label>Сумма расхода<input id="expenseAmount" type="number" step="0.01" min="0"></label><label>Кому выдано<input id="recipient"></label></div><button>Сохранить</button><button type="button" id="cancel">Отмена</button><button type="button" id="refresh">Обновить</button></form></section><section class="card"><h2>Операции</h2><button id="report">Сформировать отчёт</button><button id="clear">Очистить все</button><div class="table"><table><thead><tr><th>Дата дохода</th><th>Доход</th><th>Дата расхода</th><th>Расход</th><th>Кому</th><th>Разница</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="app.js"></script></body></html>
