<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Учёт доходов и расходов</title><link rel="stylesheet" href="style.css"></head><body><main class="container"><h1>Учёт доходов и расходов</h1><p>Данные синхронизируются с Google Таблицей.</p><section class="card connection"><h2>Подключение</h2><label>URL Google Apps Script<input id="apiUrl" type="url"></label><label>Ключ приложения<input id="apiKey" type="password"></label><button id="saveSettings">Сохранить подключение</button><span id="status"></span></section><section class="summary"><div class="card income-box">Доход<strong id="income">0.00</strong></div><div class="card expense-box">Расход<strong id="expense">0.00</strong></div><div class="card">Остаток<strong id="balance">0.00</strong></div></section><section class="card"><h2 id="title">Добавить операцию</h2><form id="form"><input type="hidden" id="id"><div class="grid"><label class="income-field">Дата дохода<input id="incomeDate" type="date"></label><label class="income-field">Сумма дохода<input id="incomeAmount" type="number" step="0.01" min="0"></label><label class="expense-field">Дата расхода<input id="expenseDate" type="date"></label><label class="expense-field">Сумма расхода<input id="expenseAmount" type="number" step="0.01" min="0"></label><label class="expense-field">Кому выдано<input id="recipient"></label></div><button>Сохранить</button><button type="button" id="cancel">Отмена</button><button type="button" id="refresh">Обновить</button></form></section><section class="card"><h2>Операции</h2><button id="report">Сформировать отчёт</button><button id="clear">Очистить все</button><div class="table"><table><thead><tr><th class="income-col">Дата дохода</th><th class="income-col">Доход</th><th class="expense-col">Дата расхода</th><th class="expense-col">Расход</th><th class="expense-col">Кому</th><th>Разница</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="app.js"></script></body></html>
