<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Учёт доходов и расходов</title><link rel="stylesheet" href="style.css"></head><body>
<button id="settingsButton" class="settings-button" title="Синхронизация">⚙</button>
<div id="settingsOverlay" class="overlay hidden"><div class="settings-popup"><button id="closeSettings" class="close">×</button><h2>Синхронизация</h2><p class="muted">Настройки сохраняются в этом браузере.</p><label>URL Google Apps Script<input id="apiUrl" type="url"></label><label>Ключ приложения<input id="apiKey" type="password"></label><button id="saveSettings">Сохранить и проверить</button><div id="status"></div></div></div>
<main class="container"><h1>Учёт доходов и расходов</h1><p class="muted">Данные синхронизируются с Google Таблицей.</p>
<section class="summary"><div class="card income-box">Доход<strong id="income">0.00</strong></div><div class="card expense-box">Расход<strong id="expense">0.00</strong></div><div class="card">Остаток<strong id="balance">0.00</strong></div></section>
<section class="card"><h2 id="title">Добавить операцию</h2><form id="form"><input type="hidden" id="id"><div class="grid"><label class="income-field">Дата дохода<input id="incomeDate" type="date"></label><label class="income-field">Сумма дохода<input id="incomeAmount" type="number" step="0.01" min="0"></label><label class="expense-field">Дата расхода<input id="expenseDate" type="date"></label><label class="expense-field">Сумма расхода<input id="expenseAmount" type="number" step="0.01" min="0"></label><label class="expense-field">Кому выдано<input id="recipient"></label></div><div id="formError" class="error"></div><button>Сохранить</button><button type="button" id="cancel">Отмена</button><button type="button" id="refresh">Обновить</button></form></section>
<section class="card"><div class="section-head"><h2>Операции</h2><div><button id="report">Сформировать отчёт</button><button id="clear" class="danger">Очистить все</button></div></div><div class="table"><table><thead><tr><th class="income-col">Дата дохода</th><th class="income-col">Доход</th><th class="expense-col">Дата расхода</th><th class="expense-col">Расход</th><th class="expense-col">Кому</th><th>Разница</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="app.js"></script></body></html>
